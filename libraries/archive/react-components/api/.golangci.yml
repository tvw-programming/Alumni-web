# golangci-lint configuration for the Go API.
#
#   docker run --rm -v "$PWD/api":/app -w /app \
#     golangci/golangci-lint:v2.12.2-alpine golangci-lint run
#
# or, with the binary installed locally: `make lint-api`.
#
# The selection below is deliberately correctness-weighted. Style-only linters
# are left off; formatting is handled by the `formatters` section, which is a
# separate pass (`golangci-lint fmt`) and does not fail the lint run.
version: "2"

run:
  # Test files carry the same rules as production code — they are the thing
  # standing between a bad change and production.
  tests: true

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard

  enable:
    # --- resource and connection leaks -------------------------------------
    # A leaked response body or unclosed sql.Rows exhausts the connection pool
    # and takes the service down under load, not in testing.
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - noctx

    # --- context correctness -----------------------------------------------
    # Handlers take a REQUEST_TIMEOUT-bounded context; dropping it silently
    # turns a bounded query into an unbounded one.
    - containedctx
    - contextcheck

    # --- error handling ----------------------------------------------------
    # errorlint catches `err == ErrX` and `%v`-wrapped errors that break
    # errors.Is/As — which is exactly how middleware/error_handler.go
    # classifies failures.
    - errorlint
    - nilerr
    - err113

    # --- correctness -------------------------------------------------------
    - asasalint
    - asciicheck
    - bidichk
    - durationcheck
    - exhaustive
    - gocritic
    - makezero
    - musttag
    - nilnil
    - reassign
    - unconvert
    - usestdlibvars
    - wastedassign

    # --- security ----------------------------------------------------------
    - gosec

    # --- maintainability ---------------------------------------------------
    - goconst
    - revive
    - unparam
    - misspell

  settings:
    errcheck:
      # An unchecked type assertion panics; the comma-ok form must be used.
      check-type-assertions: true
      # `check-blank` is deliberately off: `_ = c.SendStatus(...)` and
      # `requestID, _ := ...(string)` are how this codebase says "the failure
      # here is genuinely uninteresting". Forcing them to be handled would
      # trade a readable discard for noise.
      check-blank: false

    exhaustive:
      # Switches over a closed set (error kinds, statuses) must handle every
      # case or say explicitly that they do not.
      default-signifies-exhaustive: true

    govet:
      enable-all: true
      disable:
        # Field alignment is a micro-optimisation that fights readability.
        - fieldalignment

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Conflicts with the early-return style used throughout the handlers.
        - ifElseChain
        # Config structs are passed by value on purpose — they are copied once
        # at startup and immutability is worth more than the elided copy.
        - hugeParam
        # Naming results would shadow the identically-named locals in
        # database.Open for no readability gain.
        - unnamedResult

    gosec:
      excludes:
        # Integer conversion audit: too noisy against database/sql's int64s.
        - G115

    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: var-naming
        - name: range-val-in-closure
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: unnecessary-stmt
        - name: waitgroup-by-value

    staticcheck:
      checks:
        - all

  exclusions:
    # `lax` also drops the standard noise about missing comments on every
    # exported symbol in an internal-only package.
    presets:
      - comments
      - std-error-handling

    rules:
      # Table-driven tests legitimately repeat literals and skip error checks
      # on setup helpers.
      - path: _test\.go
        linters:
          - err113
          - goconst
          - gosec
          - unparam

      # Sentinel-free error construction is fine at the HTTP boundary, where
      # apperror.Error already carries a machine-readable code.
      - path: internal/apperror/
        linters:
          - err113

formatters:
  enable:
    - gofumpt
    - goimports

  settings:
    goimports:
      # Keeps this module's own imports in their own final group.
      local-prefixes:
        - github.com/example/idol-promo/api

# Deployment overlay for immutable images built by GitHub Actions.
#
# Requires release.env:
# API_IMAGE=ghcr.io/tvw-programming/idol-promo-api:<commit-sha>
# FRONTEND_IMAGE=ghcr.io/tvw-programming/idol-promo-frontend:<commit-sha>
#
# !reset requires modern Docker Compose. It removes local build definitions,
# ensuring the VPS only runs the exact images supplied by release.env.

services:
  api:
    build: !reset null
    image: ${API_IMAGE:?Set API_IMAGE in release.env}
    pull_policy: always

  frontend:
    build: !reset null
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in release.env}
    pull_policy: always
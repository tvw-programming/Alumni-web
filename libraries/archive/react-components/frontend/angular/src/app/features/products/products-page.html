<app-generic-card
  title="Manage Product"
  [subtitle]="subtitle()"
  icon="category"
  size="expanded"
  [error]="errorText()"
  [showRetry]="true"
  (retry)="reload()"
>
  <div card-header-action>
    <button matIconButton aria-label="Reload products" (click)="reload()">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <div class="products">
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="products__search">
      <mat-label>Quick filter</mat-label>
      <input
        matInput
        type="search"
        [value]="quickFilter()"
        (input)="quickFilter.set($any($event.target).value)"
        placeholder="Filter across all columns"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <app-data-grid
      class="products__grid"
      [rowData]="rows()"
      [columnDefs]="columnDefs"
      [loading]="isLoading()"
      [quickFilterText]="quickFilter()"
      [rowId]="rowId"
      selectionMode="single"
      [pagination]="true"
      [paginationPageSize]="25"
      noRowsMessage="No products match this filter"
      (rowClicked)="onRowClicked($event)"
    />
  </div>
</app-generic-card>

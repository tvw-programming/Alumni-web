openapi: 3.1.0
info:
  title: Idol Promo API (Spring Boot port)
  version: 1.0.0
  description: >
    The simplest Spring Boot port of the Go Fiber API. Same database, same
    endpoints, same JSON. Where the two differ, the difference is listed in
    api-spring/documentation/features/spring-boot-api.md.

servers:
  - url: http://localhost:8082

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            requestId: { type: string }
    Page:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Product' } }
        total:
          type: [integer, 'null']
          description: null when withTotal=false — distinct from 0, which means counted and none.
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
        nextCursor: { type: string, description: keyset mode only }
    Product:
      type: object
      properties:
        id: { type: integer }
        productId: { type: string, minLength: 3, maxLength: 15 }
        productName: { type: string }
        description: { type: string }
        price: { type: string, description: decimal as a string, never a float }
        rating: { type: integer, minimum: 0, maximum: 5 }
        productImagePath: { type: [string, 'null'] }
        productDocumentPaths: { type: array, items: { type: string } }
        releaseDate: { type: string, format: date }
        condition: { type: string, enum: [new, refurbished, used] }
        availability: { type: string, enum: [inStock, preorder, discontinued] }
        category: { type: string, enum: [electronics, clothing, books, home] }
        tags: { type: array, items: { type: string } }
        shippingRegions: { type: array, items: { type: string } }
        warrantyMonths: { type: integer, minimum: 0, maximum: 120 }
        isPublished: { type: boolean }
        acceptTerms: { type: boolean }
        version: { type: integer, description: bumped on every write; sent back as If-Match }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

paths:
  /health:
    get:
      summary: Readiness — the process can serve traffic, database included
      responses: { '200': { description: ok } }
  /livez:
    get:
      summary: Liveness — the process is up. Does not touch the database
      responses: { '200': { description: ok } }
  /startupz:
    get:
      summary: Startup — has the application finished booting
      responses: { '200': { description: ok }, '503': { description: starting } }

  /api/items:
    get:
      summary: Demonstration data. Public
      responses: { '200': { description: ok } }

  /api/auth/login:
    post:
      summary: Sign in. Rate limited to 10/minute per IP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                rememberMe: { type: boolean, description: 30-day refresh token instead of 7 }
      responses:
        '200': { description: access token, expiry and user; sets the refresh cookie }
        '401': { description: INVALID_CREDENTIALS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: ACCOUNT_DISABLED }
        '429': { description: ACCOUNT_LOCKED or RATE_LIMITED }
  /api/auth/refresh:
    post:
      summary: Exchange the refresh cookie for a new access token, rotating it
      responses: { '200': { description: ok }, '401': { description: NO_SESSION or INVALID_REFRESH_TOKEN } }
  /api/auth/logout:
    post:
      summary: Revoke the refresh token and clear the cookie
      responses: { '200': { description: ok } }
  /api/auth/me:
    get:
      summary: The signed-in user
      security: [{ bearer: [] }]
      responses: { '200': { description: ok }, '401': { description: UNAUTHENTICATED } }
  /api/auth/forgot-password:
    post:
      summary: Always answers the same, registered or not
      responses: { '200': { description: ok } }
  /api/auth/reset-password:
    post:
      summary: Consume a reset token, set a password, revoke every session
      responses: { '200': { description: ok }, '400': { description: INVALID_RESET_TOKEN or WEAK_PASSWORD } }

  /api/products:
    get:
      summary: List products. Public
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [offset, keyset, all], default: offset } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string }, description: implies keyset mode }
        - { name: withTotal, in: query, schema: { type: boolean, default: true } }
        - { name: search, in: query, schema: { type: string }, description: matches productName or productId }
        - { name: sortBy, in: query, schema: { type: string, enum: [productId, productName, price, rating, releaseDate, category, createdAt] } }
        - { name: sortDir, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: category, in: query, schema: { type: string } }
        - { name: condition, in: query, schema: { type: string } }
        - { name: availability, in: query, schema: { type: string } }
        - { name: isPublished, in: query, schema: { type: boolean } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: region, in: query, schema: { type: string } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '400': { description: INVALID_CURSOR or UNSUPPORTED_KEYSET }
    post:
      summary: Create. JSON or multipart; honours Idempotency-Key
      security: [{ bearer: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: the created product, with an ETag }
        '401': { description: UNAUTHENTICATED }
        '403': { description: FORBIDDEN — needs products:create }
        '409': { description: DUPLICATE_PRODUCT_ID, IDEMPOTENCY_KEY_REUSED or REQUEST_IN_PROGRESS }

  /api/products/{id}:
    get:
      summary: One product, with an ETag carrying its version
      responses: { '200': { description: ok }, '404': { description: NOT_FOUND } }
    patch:
      summary: Partial update. If-Match makes it conditional
      security: [{ bearer: [] }]
      parameters:
        - { name: If-Match, in: header, schema: { type: string }, description: 'the version, e.g. "3"' }
      responses:
        '200': { description: the updated product }
        '400': { description: INVALID_IF_MATCH or INVALID_BODY }
        '409': { description: VERSION_CONFLICT }
    delete:
      summary: Delete. If-Match makes it conditional
      security: [{ bearer: [] }]
      responses: { '200': { description: ok }, '409': { description: VERSION_CONFLICT } }

  /uploads/{filename}:
    get:
      summary: An uploaded file. Public — an img tag cannot send a header
      responses: { '200': { description: the file } }

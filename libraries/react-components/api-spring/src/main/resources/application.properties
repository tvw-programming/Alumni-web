server.port=${PORT:8080}

# Same database the Go API uses. Both can run at once: this app owns no schema
# and runs no migrations - db/init/*.sql is still the single source of truth.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:items_app}
spring.datasource.username=${DB_USER:items_user}
spring.datasource.password=${DB_PASSWORD:items_password}

# Uploads land beside the Go API's, so a file created through either is served
# by either.
app.upload-dir=${UPLOAD_DIR:./uploads}

# Signing key for access tokens. The app refuses to start without one outside
# dev - see Application.java.
app.jwt-secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
app.access-token-minutes=${ACCESS_TOKEN_MINUTES:15}
app.refresh-token-days=${REFRESH_TOKEN_DAYS:7}
app.remember-me-days=${REMEMBER_ME_DAYS:30}
app.cookie-secure=${COOKIE_SECURE:false}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

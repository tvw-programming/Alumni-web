# Cache policy, keyed on the request path.
#
# Vite emits every hashed build artifact under /assets/ (assetsDir default),
# so that prefix — and only that prefix — is safe to cache immutably. Every
# other path, above all /index.html, must be revalidated: index.html is
# rewritten on each deploy and names the current hashed bundles. Serving a
# stale index.html points browsers at bundles that no longer exist.
#
# `map` must live at http level, which is where conf.d files are included.
map $uri $cache_control {
    default    "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    # Proxied to the Go Fiber `api` service so the SPA can call a same-origin
    # `/api/...` path in every environment (docker, and via the Vite dev
    # proxy in vite.config.ts) — no CORS configuration needed on the API.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Hashed build output only. `=404` instead of the SPA fallback below, so a
    # missing bundle fails loudly rather than returning index.html with a 200.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # `default_type` rather than `add_header Content-Type`: a location-level
    # add_header would drop every header inherited from the server block.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Cache policy, keyed on the request path.
#
# This is where the Angular config genuinely differs from the React one next to
# it. Vite emits every hashed artifact under `/assets/`, so React can cache one
# directory prefix immutably. The Angular application builder emits hashed files
# at the **root** of the output — `main-NFFYVU6A.js`, `chunk-B0AgGFZb.js`,
# `styles-YB7RYSAT.css` — beside files that are not hashed at all.
#
# So the rule keys on the filename shape rather than a directory. Getting this
# wrong in either direction is a real outage:
#
#   - Caching `index.html` immutably points browsers at bundles that no longer
#     exist after the next deploy.
#   - Caching `/schemas/*.json` immutably freezes the Order Form's schema, which
#     is fetched at runtime precisely so it can change without a rebuild.
#
# `map` must live at http level, which is where conf.d files are included.
map $uri $cache_control {
    default                                              "no-cache";
    "~^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$"            "public, max-age=31536000, immutable";
    "~^/media/"                                          "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $cache_control always;

    # Proxied to the Go Fiber `api` service so the SPA can call a same-origin
    # `/api/...` path in every environment — no CORS configuration on the API.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Runtime-fetched schemas (see the Order Form). Served, but revalidated —
    # the whole point of loading them over HTTP is that they can change.
    location ^~ /schemas/ {
        try_files $uri =404;
    }

    # A missing hashed bundle must fail loudly rather than falling through to
    # the SPA rewrite below and returning index.html with a 200 — which is how
    # "the app loads but does nothing" incidents happen.
    # Quoted: nginx reads a bare `{` in a regex as the start of a block, so an
    # unquoted `{8,}` fails to parse with "unknown directive".
    location ~ "^/[^/]+-[A-Za-z0-9_-]{8,}\.(?:js|css)$" {
        try_files $uri =404;
    }

    # `default_type` rather than `add_header Content-Type`: a location-level
    # add_header would drop every header inherited from the server block.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The dev-only unit-test runner is NOT proxied here, deliberately. It runs a
    # shell command; it exists under `pnpm dev` and must not be reachable from a
    # deployed build. The Unit tests tab degrades to "no report available".

    location / {
        try_files $uri $uri/ /index.html;
    }
}

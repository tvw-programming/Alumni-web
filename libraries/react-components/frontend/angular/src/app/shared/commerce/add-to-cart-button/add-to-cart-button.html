<button
  matButton="filled"
  type="button"
  class="atc__button"
  [disabled]="disabled()"
  [attr.aria-label]="accessibleName()"
  [attr.aria-busy]="busy()"
  (click)="onClick()"
>
  @if (busy()) {
    <mat-progress-spinner mode="indeterminate" diameter="18" aria-hidden="true" />
  } @else {
    <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  }
  <span class="atc__label">{{ text() }}</span>
</button>

@if (state() === 'added') {
  <button matButton type="button" class="atc__secondary" (click)="viewCart.emit()">
    View cart
  </button>
}

<!-- Persistent, not a toast: the brief specifically warns against confirmation
     that vanishes before it can be understood. -->
@if (announcement(); as message) {
  <p
    class="atc__status"
    [class.atc__status--error]="state() === 'error'"
    [attr.role]="state() === 'error' ? 'alert' : 'status'"
  >
    {{ message }}
  </p>
}

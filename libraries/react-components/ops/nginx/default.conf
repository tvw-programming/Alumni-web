# Edge reverse proxy for docker-compose.production.yaml's `edge` service.
#
# Sits in front of the `frontend` service (itself an nginx that serves the
# SPA and proxies /api/* internally — see frontend/nginx.conf). This layer's
# job is TLS termination plus the ACME HTTP-01 challenge certbot needs.
#
# This file is the PRE-CERTIFICATE configuration: plain HTTP only. Let's
# Encrypt cannot issue a certificate for a bare IP address, so nginx cannot
# listen on 443 with a real certificate until:
#   1. a domain's A/AAAA record points at this VPS's public IP, and
#   2. a certificate has been issued at least once, e.g.:
#        docker compose -f docker-compose.yaml -f docker-compose.production.yaml \
#          --profile certbot run --rm certbot certonly \
#          --webroot --webroot-path=/var/www/certbot -d your-domain.example
#
# Once the certificate exists, swap this file for the HTTPS version — see
# ops/nginx/tls.conf.example for the full procedure.
#
# Port 443 stays published (in docker-compose.production.yaml) but nothing
# listens on it until then, which is harmless.

# WebSocket / HTTP upgrade passthrough. `map` must live at http level, which
# is where conf.d files are included.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Required for certbot's HTTP-01 challenge (webroot mode). `^~` stops
    # nginx from evaluating regex locations for this prefix. Keep this
    # location active even after HTTPS is enabled.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # `default_type` rather than `add_header Content-Type` so this location
    # keeps inheriting the security headers declared above.
    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# Local development overlay.
# It publishes every useful service on loopback only.
#
# Run:
# docker compose \
#   -f docker-compose.yaml \
#   -f docker-compose.dev.yaml \
#   up --build

services:
  db:
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

    # `backend` is `internal: true`, and Docker silently ignores published
    # ports on a container attached only to an internal network — the mapping
    # above would look correct in the file and simply not exist. Attaching a
    # second, non-internal network in development is what makes psql/pgAdmin
    # on the host able to reach 127.0.0.1:5433. Production never loads this
    # overlay, so the database stays unreachable from outside there.
    networks:
      - backend
      - dbtools

  api:
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8080"

  api-spring:
    ports:
      - "127.0.0.1:${API_SPRING_HOST_PORT:-8082}:8080"

  frontend:
    ports:
      - "127.0.0.1:${HTTP_PORT:-8090}:8080"

networks:
  dbtools:

# Production infrastructure overlay.
#
# Requires:
#   ./ops/nginx/default.conf
#   Existing TLS certificate in certbot_certs volume
#
# Run with locally built application images:
# docker compose \
#   -f docker-compose.yaml \
#   -f docker-compose.production.yaml \
#   up -d --build --wait

services:
  api:
    environment:
      APP_ENV: production
      AUTH_SECURE_COOKIES: "true"

  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    init: true

    depends_on:
      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./ops/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro

    networks:
      - frontend

    # Nginx config should define GET /edge-health.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1/edge-health
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

    read_only: true

    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Optional certificate creation/renewal container.
  # It does not start unless the "certbot" profile is selected.
  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - certbot

    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot

    networks:
      - frontend

    command:
      - renew
      - --webroot
      - --webroot-path=/var/www/certbot

  # Optional same-server monitoring.
  # External Uptime Kuma is preferable because it can detect VPS outages.
  uptime-kuma:
    image: louislam/uptime-kuma:2.3.2
    profiles:
      - monitoring

    restart: unless-stopped

    ports:
      # Access through an SSH tunnel or authenticated Nginx location.
      - "127.0.0.1:${KUMA_PORT:-3001}:3001"

    volumes:
      - uptime_kuma_data:/app/data

    networks:
      - frontend

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  certbot_certs:
  certbot_webroot:
  uptime_kuma_data:

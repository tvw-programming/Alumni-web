# ---------------------------------------------------------------------------
# CodeGen Core — backend pipeline + run monitor, native on Apple Silicon.
#
#   make up          build, start, open the browser
#   make logs        follow both services
#   make down        stop and keep the run data
#   make clean       stop and delete the run data
#
# Every image is built for linux/arm64, so nothing runs under QEMU on an M-series
# Mac. On an Intel Mac or a CI runner, override with:
#   CODEGEN_PLATFORM=linux/amd64 make up
# ---------------------------------------------------------------------------

name: codegen-core

x-platform: &platform ${CODEGEN_PLATFORM:-linux/arm64}

services:
  # -------------------------------------------------------------------------
  # The pipeline: runs the 24 stages, serves the gate API, watches for
  # decisions taken in the browser and resumes the run when one arrives.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      platforms: [*platform]
      args:
        # Match the host user so files written into ./backend/sample-project stay yours.
        UID: ${CODEGEN_UID:-501}
        GID: ${CODEGEN_GID:-20}
    image: codegen/core-backend:2.0.0
    platform: *platform
    container_name: codegen-core-backend
    restart: unless-stopped

    environment:
      CODEGEN_PROFILE: ${CODEGEN_PROFILE:-docker}
      CODEGEN_STORY: ${CODEGEN_STORY:-DEEP-2041}
      CODEGEN_SEED_RUN: ${CODEGEN_SEED_RUN:-0}
      CODEGEN_SEED_STOP: ${CODEGEN_SEED_STOP:-5}
      CODEGEN_WATCH_INTERVAL: ${CODEGEN_WATCH_INTERVAL:-3}
      # Only read when you switch to the docker-cloud profile.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEDIA_ROOT: /workspace/media

    volumes:
      # The project the agent implements against. Edits appear on your Mac.
      - ./backend/sample-project:/workspace
      # Drop a .md file in here and it becomes a runnable story.
      - ./backend/stories:/stories
      # Live-edit the pipeline itself without rebuilding.
      - ./backend/src:/app/src:ro
      - ./backend/config:/app/config:ro
      # Journals and artifacts survive `make down`.
      - codegen-core-data:/data

    ports:
      - "${CODEGEN_API_PORT:-8000}:8000"

    # Lets the docker-ollama profile reach an Ollama running on the Mac itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 6

  # -------------------------------------------------------------------------
  # The dashboard. Vite dev server against a bind mount, so editing a component
  # on the Mac reloads the browser.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: ${CODEGEN_FRONTEND_TARGET:-dev}
      platforms: [*platform]
    image: codegen/core-frontend:1.0.0
    platform: *platform
    container_name: codegen-core-frontend
    restart: unless-stopped

    environment:
      # Resolved by the browser, not by this container, so it is localhost on
      # the Mac rather than the compose service name.
      VITE_API_BASE: http://localhost:${CODEGEN_API_PORT:-8000}
      VITE_JOB_ID: ${CODEGEN_JOB_ID:-}

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # Keep the image's node_modules: the arm64 binaries in it are not the
      # ones a bind mount from macOS would provide.
      - /app/node_modules

    ports:
      - "${CODEGEN_FRONTEND_PORT:-5173}:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  codegen-core-data:
    name: codegen-core-data

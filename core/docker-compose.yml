# ---------------------------------------------------------------------------
# CodeGen Core — backend pipeline + run monitor, native on Apple Silicon.
#
#   make up          build, start, open the browser
#   make logs        follow both services
#   make down        stop and keep the run data
#   make clean       stop and delete the run data
#
# Every image is built for linux/arm64, so nothing runs under QEMU on an M-series
# Mac. On an Intel Mac or a CI runner, override with:
#   CODEGEN_PLATFORM=linux/amd64 make up
# ---------------------------------------------------------------------------

name: codegen-core

x-platform: &platform ${CODEGEN_PLATFORM:-linux/arm64}

services:
  # -------------------------------------------------------------------------
  # The pipeline: runs the 24 stages, serves the gate API, watches for
  # decisions taken in the browser and resumes the run when one arrives.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      platforms: [*platform]
      args:
        # Match the host user so files written into ./backend/sample-project stay yours.
        UID: ${CODEGEN_UID:-501}
        GID: ${CODEGEN_GID:-20}
    image: codegen/core-backend:2.0.0
    platform: *platform
    container_name: codegen-core-backend
    restart: unless-stopped

    environment:
      # Every capability routes to the model loaded in LM Studio on the Mac.
      # CODEGEN_PROFILE=docker-freebuff uses the free gateway instead;
      # CODEGEN_PROFILE=docker goes back to mocked, offline, zero-network.
      CODEGEN_PROFILE: ${CODEGEN_PROFILE:-docker-lmstudio}
      CODEGEN_STORY: ${CODEGEN_STORY:-DEEP-2042}
      CODEGEN_SEED_RUN: ${CODEGEN_SEED_RUN:-0}
      CODEGEN_SEED_STOP: ${CODEGEN_SEED_STOP:-5}
      CODEGEN_WATCH_INTERVAL: ${CODEGEN_WATCH_INTERVAL:-3}
      # Only read when you switch to the docker-cloud profile.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Only read by the docker-lmstudio profile. LM Studio runs on the Mac, so
      # the container reaches its server through host.docker.internal. The key is
      # ignored by LM Studio but the OpenAI client refuses to send an empty one.
      LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-lm-studio}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-qwen3-coder-30b-a3b-instruct}
      # Taken when the model above fails, and by steps 13 and 23, which review
      # what 12 and 15 wrote and so must not run on the same model.
      LMSTUDIO_FALLBACK_MODEL: ${LMSTUDIO_FALLBACK_MODEL:-qwen/qwen3.5-9b}
      # Only read by the docker-freebuff profile. The gateway runs on the Mac,
      # so the default base_url reaches it through host.docker.internal.
      FREEBUFF_API_KEY: ${FREEBUFF_API_KEY:-freebuff}
      FREEBUFF_BASE_URL: ${FREEBUFF_BASE_URL:-http://host.docker.internal:8080/v1}
      FREEBUFF_FAST_MODEL: ${FREEBUFF_FAST_MODEL:-Gemini-3.1-Flash-Lite}
      FREEBUFF_CODING_MODEL: ${FREEBUFF_CODING_MODEL:-DeepSeek-V4-Pro}
      FREEBUFF_REASONING_MODEL: ${FREEBUFF_REASONING_MODEL:-MiniMax-M3}
      MEDIA_ROOT: /workspace/media

    volumes:
      # The projects the agent may implement against. Which one it actually
      # edits is app.project.path in backend/config/config.json — change it
      # there, not here. These mounts only decide what is reachable.
      #
      # Writes are still confined to the configured project: GuardedFS roots
      # itself at that path, so a step cannot wander into a sibling app.
      - ../apps:/projects
      # The component library the pipeline implements user stories against —
      # app.project.path in backend/config/config.json points here.
      - ../libraries:/libraries
      # The original demo target, kept so config.json can point back at it.
      - ./backend/sample-project:/workspace
      # Drop a .md file in here and it becomes a runnable story.
      - ./backend/stories:/stories
      # Live-edit the pipeline itself without rebuilding.
      - ./backend/src:/app/src:ro
      - ./backend/config:/app/config:ro
      # Journals and artifacts survive `make down`.
      - codegen-core-data:/data

    ports:
      - "${CODEGEN_API_PORT:-8000}:8000"

    # Lets the docker-ollama profile reach an Ollama running on the Mac itself.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 25s
      retries: 6

  # -------------------------------------------------------------------------
  # The dashboard. Vite dev server against a bind mount, so editing a component
  # on the Mac reloads the browser.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: ${CODEGEN_FRONTEND_TARGET:-dev}
      platforms: [*platform]
    image: codegen/core-frontend:1.0.0
    platform: *platform
    container_name: codegen-core-frontend
    restart: unless-stopped

    environment:
      # Resolved by the browser, not by this container, so it is localhost on
      # the Mac rather than the compose service name.
      VITE_API_BASE: http://localhost:${CODEGEN_API_PORT:-8000}
      VITE_JOB_ID: ${CODEGEN_JOB_ID:-}

    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      # Keep the image's node_modules: the arm64 binaries in it are not the
      # ones a bind mount from macOS would provide.
      - /app/node_modules

    ports:
      - "${CODEGEN_FRONTEND_PORT:-5173}:5173"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

volumes:
  codegen-core-data:
    name: codegen-core-data

[project]
name = "codegen-core"
version = "2.0.0"
description = "24-stage AI development workflow with two mandatory human gates"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
llm = ["langchain-core>=0.3", "deepagents>=0.0.5"]
anthropic = ["langchain-anthropic>=0.3"]
openai = ["langchain-openai>=0.3"]
ollama = ["langchain-ollama>=0.2"]
bedrock = ["langchain-aws>=0.2"]
dashboard = ["fastapi>=0.115", "uvicorn>=0.30"]
# Reading a .pdf or .docx a reviewer uploads at a gate. Optional: without them
# those uploads are refused with a message, and .md keeps working.
documents = ["pymupdf>=1.24", "python-docx>=1.1"]
monitor = ["fastapi>=0.115", "uvicorn>=0.30", "httpx"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "fastapi", "httpx"]

[project.scripts]
codegen-core = "codegen_core.cli:main"
codegen-core-monitor = "codegen_core.dashboard.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegen_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "acme-profile-service"
version = "0.3.0"
description = "User profile service — the codebase CodeGen Core implements against"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
source = ["app"]

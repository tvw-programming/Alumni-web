# ---------------------------------------------------------------------------
# Alumni sample app.
#
# Included from the repository root compose file, so `docker compose up -d`
# there starts this alongside the core backend and run monitor.
#
#   http://localhost:5174
#
# Runs on fixture data by default: the Go gateway in ./api is scaffolding and
# does not compile yet. Set CODEGEN_ALUMNI_FIXTURES=false once it does.
# ---------------------------------------------------------------------------

services:

  # -------------------------------------------------------------------------
  # Postgres for the alumni app. Its own instance rather than sharing the
  # library's: this schema is applied by the gateway at startup, and pointing
  # migrations at a database another project owns is how two projects end up
  # fighting over one schema_migrations table.
  # -------------------------------------------------------------------------
  alumni-db:
    image: postgres:17-alpine
    container_name: codegen-alumni-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ALUMNI_DB_NAME:-alumni}
      POSTGRES_USER: ${ALUMNI_DB_USER:-alumni}
      POSTGRES_PASSWORD: ${ALUMNI_DB_PASSWORD:-alumni-dev-only}
    volumes:
      - alumni-db-data:/var/lib/postgresql/data
    ports:
      - "${ALUMNI_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALUMNI_DB_USER:-alumni} -d ${ALUMNI_DB_NAME:-alumni}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # The Go Fiber gateway. Serves alumni CRUD only — Firebase session validation,
  # signed uploads and Vision moderation are written but not wired here, because
  # they need Google credentials this environment does not have.
  # -------------------------------------------------------------------------
  alumni-api:
    build:
      context: .
      dockerfile: api/Dockerfile
      platforms: [linux/arm64]
    image: codegen/alumni-api:1.0.0
    container_name: codegen-alumni-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${ALUMNI_DB_USER:-alumni}:${ALUMNI_DB_PASSWORD:-alumni-dev-only}@alumni-db:5432/${ALUMNI_DB_NAME:-alumni}?sslmode=disable
      # There is no authenticated mode in this build; the server refuses to
      # start unless this says so explicitly.
      AUTH_MODE: dev-no-auth
      CORS_ORIGINS: http://localhost:${CODEGEN_ALUMNI_PORT:-5174}
      PORT: "8080"
    ports:
      - "${ALUMNI_API_PORT:-8080}:8080"
    depends_on:
      alumni-db:
        condition: service_healthy

  alumni-web:
    build:
      # The repository root, because the app imports the shared components as
      # source from libraries/. A context of apps/react-web cannot see them.
      context: ../..
      dockerfile: apps/react-web/Dockerfile
      target: dev
      platforms: [linux/arm64]
    image: codegen/alumni-web:1.0.0
    container_name: codegen-alumni-web
    restart: unless-stopped

    environment:
      # Node resolves the library's own bare imports by walking up from the
      # importing file, so the library has to sit inside /app to reach
      # /app/node_modules. vite.config.ts reads this.
      ALUMNI_LIB_SRC: /app/.library
      VITE_USE_FIXTURES: ${CODEGEN_ALUMNI_FIXTURES:-true}
      VITE_API_TARGET: ${CODEGEN_ALUMNI_API:-http://alumni-api:8080}
      # Firebase is only reached once fixtures are off; empty values are fine
      # until then, and the app renders without them.
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}

    volumes:
      # This app's source.
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      # The shared library, inside /app so its own imports resolve against
      # /app/node_modules. Read-only: this app consumes it, never edits it.
      - ../../libraries/archive/react-components/frontend/react/src:/app/.library:ro
      # Keep the image's node_modules. A bind mount from macOS would shadow it
      # with host-built binaries that are not the ones this arm64 image needs.
      - /app/node_modules

    ports:
      - "${CODEGEN_ALUMNI_PORT:-5174}:5174"

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  alumni-db-data:
    name: codegen-alumni-db-data

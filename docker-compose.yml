# ---------------------------------------------------------------------------
# CodeGen — monorepo stack.
#
#   npm run docker:up     start everything
#   npm run docker:down   stop it
#
# The core services (the 24-step workflow backend and its dashboard) are
# defined in core/docker-compose.yml and pulled in here, so `make up` from
# core/ and `docker compose up` from the repo root bring up the same thing.
# ---------------------------------------------------------------------------

name: codegen

include:
  - path: core/docker-compose.yml
    project_directory: core
  # The Alumni sample app — http://localhost:5174. Runs on fixture data until
  # its Go gateway compiles; see apps/react-web/README.md.
  - path: apps/react-web/docker-compose.yml
    project_directory: apps/react-web
